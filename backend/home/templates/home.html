{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>SentinelX SOC</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body>
    <div class="w-full h-screen bg-zinc-900 flex flex-col">

        <nav class="w-full flex items-center justify-between px-10 py-5 border-b border-zinc-800">

                <span class="text-red-500 font-bold text-xl tracking-tight">SentinelX</span>

            <div class="flex items-center gap-3">

        <div class="flex-1 flex flex-col items-center justify-center p-10 text-center">
