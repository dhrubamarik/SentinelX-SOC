{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelX SOC</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-zinc-900 text-white font-sans">
    <div class="w-full min-h-screen flex flex-col">

        <!-- Navigation Bar -->
        <nav class="w-full flex items-center justify-between px-8 py-4 border-b border-zinc-800">
            <div class="flex items-center gap-2">
                <span class="text-red-500 font-bold text-xl">SentinelX</span>
                <span class="text-zinc-500 text-xs font-medium uppercase tracking-wide">SOC</span>
            </div>

            <div class="flex items-center gap-3">
                <a href="{% url 'login' %}"
                   class="px-4 py-2 text-sm text-zinc-300 border border-zinc-700 rounded-lg hover:bg-zinc-800 transition-colors">
                    Log In
                </a>
                <a href="{% url 'register' %}"
                   class="px-4 py-2 text-sm text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors">
                    Register
                </a>
            </div>
        </nav>

        <!-- Hero Section -->
        <main class="flex-1 flex flex-col items-center justify-center px-6 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">
                Welcome to <span class="text-red-500">SentinelX</span>
            </h1>

            <p class="text-zinc-400 text-base md:text-lg max-w-lg mb-8">
                Monitor authentication events, detect suspicious activity, and investigate
                security incidents in real time.
            </p>

            <a href="{% url 'soc_login' %}"
               class="px-4 py-2 text-sm text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors">
                Access SOC Portal
            </a>
        </main>

        <!-- Footer -->
        <footer class="w-full py-5 border-t border-zinc-800 text-center text-xs text-zinc-500">
            &copy; {% now "Y" %} SentinelX SOC Platform. All rights reserved.
        </footer>

    </div>
</body>

</html>
