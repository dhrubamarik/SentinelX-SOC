{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelX SOC - Admin Auth</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen font-sans">
    
    <div class="w-full max-w-md p-8 bg-slate-900 border border-red-500/40 rounded-xl shadow-2xl relative overflow-hidden">
        
        <!-- Glowing Header Bar -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-red-600 via-amber-500 to-red-600"></div>

        <!-- Title Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-red-500/10 border border-red-500/30 rounded-lg text-red-500 mb-3">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-widest text-red-500">
                SENTINEL<span class="text-white">X</span> SOC
            </h1>
            <p class="text-xs font-mono uppercase tracking-wider text-slate-400 mt-1">
                Restricted Operations Access
            </p>
        </div>

        <!-- Flash Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="p-3 mb-6 text-xs font-semibold bg-red-950/80 border border-red-500/60 rounded-lg text-red-200 flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation text-red-400"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Form -->
        <form method="POST" action="/soc/login/" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs uppercase font-bold tracking-wider text-slate-300 mb-1.5">
                    Superuser Username
                </label>
                <input type="text" name="username" required 
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-white placeholder-slate-500 focus:border-red-500 focus:ring-1 focus:ring-red-500 focus:outline-none transition"
                       placeholder="admin">
            </div>

            <div>
                <label class="block text-xs uppercase font-bold tracking-wider text-slate-300 mb-1.5">
                    Password
                </label>
                <input type="password" name="password" required 
                       class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-white placeholder-slate-500 focus:border-red-500 focus:ring-1 focus:ring-red-500 focus:outline-none transition"
                       placeholder="••••••••">
            </div>

            <div>
                <label class="block text-xs uppercase font-bold tracking-wider text-red-400 mb-1.5 flex items-center justify-between">
                    <span>SOC Passkey</span>
                    <span class="text-[10px] text-red-500/80 font-normal">Required</span>
                </label>
                <input type="password" name="passkey" required 
                       class="w-full bg-slate-950 border border-red-500/50 rounded-lg p-3 text-sm text-white placeholder-slate-600 focus:border-red-500 focus:ring-1 focus:ring-red-500 focus:outline-none transition"
                       placeholder="Enter secret passkey...">
            </div>

            <button type="submit" 
                    class="w-full py-3.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-all shadow-lg shadow-red-600/20 text-xs uppercase tracking-widest flex items-center justify-center gap-2">
                <i class="fa-solid fa-lock"></i>
                <span>Authenticate Session</span>
            </button>
        </form>

    </div>

</body>
</html>
